
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login System</title>

    <link rel="stylesheet" href="style.css">

    <!-- Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="container">

        <!-- LOGIN PAGE -->
        <section id="loginPage" class="card">
            <h1>Student Login</h1>
            <p class="subtitle">Welcome back! Please log in.</p>

            <form id="loginForm">
                <label for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        data-target="loginPassword"
                        aria-label="Show password"
                    >
                        <i data-lucide="eye"></i>
                    </button>
                </div>

                <button type="submit" class="primary-btn">Login</button>
            </form>

            <p class="switch-text">
                Don't have an account?
                <a href="#" id="showRegister">Register here</a>
            </p>
        </section>


        <!-- REGISTER PAGE -->
        <section id="registerPage" class="card hidden">
            <h1>Create Account</h1>
            <p class="subtitle">Register to get started.</p>

            <form id="registerForm">
                <label for="registerName">Full Name</label>
                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required
                >

                <label for="registerEmail">Email</label>
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="registerPassword">Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 6 characters"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        data-target="registerPassword"
                        aria-label="Show password"
                    >
                        <i data-lucide="eye"></i>
                    </button>
                </div>

                <label for="confirmPassword">Confirm Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirmPassword"
                        aria-label="Show password"
                    >
                        <i data-lucide="eye"></i>
                    </button>
                </div>

                <button type="submit" class="primary-btn">Register</button>
            </form>

            <p class="switch-text">
                Already have an account?
                <a href="#" id="showLogin">Login here</a>
            </p>
        </section>


        <!-- DASHBOARD PAGE -->
        <section id="dashboardPage" class="hidden dashboard">

            <header class="dashboard-header">
                <div>
                    <h1>Student Dashboard</h1>
                    <p id="welcomeMessage">Welcome!</p>
                </div>

                <!-- Same styling as Save Notes button -->
                <button id="logoutBtn" class="primary-btn logout-btn">
                    <i data-lucide="log-out"></i>
                    Logout
                </button>
            </header>

            <div class="dashboard-content">
                <h2>Digital Notes</h2>
                <p class="subtitle">Write down and organize your study notes.</p>

                <form id="notesForm">
                    <label for="noteTitle">Note Title</label>
                    <input
                        type="text"
                        id="noteTitle"
                        placeholder="Enter note title"
                        required
                    >

                    <label for="noteContent">Note Content</label>
                    <textarea
                        id="noteContent"
                        placeholder="Write your notes here..."
                        rows="5"
                        required
                    ></textarea>

                    <button type="submit" class="primary-btn">
                        <i data-lucide="save"></i>
                        Save Notes
                    </button>
                </form>

                <div class="notes-section">
                    <h2>My Saved Notes</h2>
                    <div id="notesList" class="notes-list"></div>
                </div>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
